# The desktop app's installers (ADR-0020, phase 4): a .deb and an AppImage, a
# .dmg and an .msi, each carrying the `valk` of the same release. release.yml
# calls it once that release's `valk` binaries are up. Run by hand it is a dry
# run: it builds the installers around the latest release's `valk` and uploads
# nothing.
#
# Nothing here is signed with a certificate. The macOS app is signed ad hoc (an
# unsigned one is refused outright as damaged on Apple silicon) and still has to
# be allowed once in System Settings; Windows shows a SmartScreen prompt. The
# hash check below catches a broken download, not a tampered release: the hash
# comes from the same release as the file.
name: desktop

on:
  workflow_call:
    inputs:
      release:
        description: "The GitHub release (its tag name) to take `valk` from and upload to"
        type: string
        required: true
      ref:
        description: "What to build: a tag or a commit"
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # An older Ubuntu, so the app runs against the glibc and WebKitGTK of
          # distributions that are still in use.
          - os: ubuntu-22.04
            valk: valk-x86_64-unknown-linux-musl.tar.gz
            bundles: deb,appimage
          - os: macos-latest
            valk: valk-aarch64-apple-darwin.tar.gz
            bundles: dmg
          - os: windows-latest
            valk: valk-x86_64-pc-windows-msvc.zip
            bundles: msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      # Empty on a dry run: the latest release's `valk`, and no upload.
      TAG: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: WebKitGTK, the tray's library and what the AppImage needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf file
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-bundle
      # The same binary the release's own installers give out, checked against
      # the hash published beside it.
      - name: valk of this release
        env:
          VALK: ${{ matrix.valk }}
        run: |
          # sha256sum on Linux and in Git Bash on Windows; macOS has shasum.
          sha256() { if command -v sha256sum >/dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          mkdir -p download crates/valkyrie-desktop/resources
          # shellcheck disable=SC2086
          gh release download $TAG --repo "$GITHUB_REPOSITORY" --dir download \
            --pattern "$VALK" --pattern "$VALK.sha256"
          # The Windows build writes its hash file with a CR at the end of the
          # line, which shasum would take for part of the file's name.
          (cd download && tr -d '\r' < "$VALK.sha256" | sha256 -c -)
          case "$VALK" in
            # Git Bash has no unzip; PowerShell has.
            *.zip) pwsh -NoProfile -Command "Expand-Archive -Force -Path 'download/$VALK' -DestinationPath 'crates/valkyrie-desktop/resources'" ;;
            *) tar -xzf "download/$VALK" -C crates/valkyrie-desktop/resources ;;
          esac
          ls -l crates/valkyrie-desktop/resources
      # The version the bundle settings were tried with, not whatever is newest
      # on the day of a release.
      - name: Tauri's bundler
        run: cargo install tauri-cli --version "=2.12.4" --locked
      - name: bundle
        working-directory: crates/valkyrie-desktop
        run: cargo tauri build --features window --config tauri.bundle.conf.json --bundles "${{ matrix.bundles }}" -- --locked
      - name: publish
        run: |
          # sha256sum on Linux and in Git Bash on Windows; macOS has shasum.
          sha256() { if command -v sha256sum >/dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          shopt -s nullglob
          files=(target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage
                 target/release/bundle/dmg/*.dmg target/release/bundle/msi/*.msi)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no installer was built"; exit 1; }
          for file in "${files[@]}"; do
            (cd "$(dirname "$file")" && sha256 "$(basename "$file")" > "$(basename "$file").sha256")
            ls -l "$file"
          done
          if [ -z "$TAG" ]; then
            echo "dry run: nothing uploaded"
            exit 0
          fi
          for file in "${files[@]}"; do
            gh release upload "$TAG" "$file" "$file.sha256" --clobber
          done
