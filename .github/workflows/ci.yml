name: test

on:
  # Branches only: a tag push runs this through release.yml instead.
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      # What to test: release.yml passes the tag, which can be older than the push
      # that called it.
      ref:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # release-please reads commit subjects to pick the next version (docs/releasing.md).
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # A squash merge lands the title as the commit on main.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/msg"
          .githooks/commit-msg "$RUNNER_TEMP/msg" || status=1
          status=${status:-0}
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            .githooks/commit-msg "$RUNNER_TEMP/msg" || status=1
          done
          exit "$status"
  rust:
    strategy:
      fail-fast: false
      matrix:
        # Every platform release.yml ships a binary for.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
      - name: Validate shell installers
        if: runner.os == 'Linux'
        run: shellcheck install.sh install-release.sh .githooks/commit-msg
      - name: Validate PowerShell installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('install.ps1', 'install-wsl.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }

  # The rust-version Cargo.toml promises.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # `valk` embeds the committed web/dist, so it must match web/src.
      - run: npm run build
      - name: web/dist is up to date
        run: |
          git status --porcelain -- dist
          test -z "$(git status --porcelain -- dist)" \
            || { echo "::error::web/dist is stale: run 'npm run build' in web/ and commit it"; exit 1; }
