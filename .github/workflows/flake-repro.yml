name: flake-repro

# Temporary (backlog #17): runs the flaky daemon tests on a deliberately starved runner,
# the condition every CI hit shared (test binary 12-21s instead of 5-6s).
on:
  push:
    branches: ["fix/17-intermittent-ci-test-failures-on"]

permissions:
  contents: read

jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            test: windows
          - os: macos-latest
            test: daemon
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: build
        shell: bash
        run: |
          cargo test -p valkyrie-daemon --test ${{ matrix.test }} --locked --no-run --message-format=json \
            | grep -o '"executable":"[^"]*"' | grep -v null | head -1 | cut -d'"' -f4 > bin.txt
          cat bin.txt
      - name: pty exhaustion errno
        if: runner.os == 'macOS'
        run: |
          python3 -c '
          import os, pty
          fds = []
          try:
              while True:
                  fds.extend(pty.openpty())
          except OSError as e:
              print("ptys opened:", len(fds) // 2, "then errno", e.errno, e.strerror)
          '
      - name: loop under cpu load
        shell: bash
        run: |
          bin=$(sed 's#\\\\#/#g' bin.txt)
          for j in $(seq 1 12); do (while :; do :; done) & done
          fails=0
          for i in $(seq 1 10); do
            start=$SECONDS
            pids=()
            for c in 1 2 3; do "$bin" > "out-$i-$c.txt" 2>&1 & pids+=($!); done
            for c in 1 2 3; do
              if ! wait "${pids[$((c - 1))]}"; then
                fails=$((fails + 1))
                echo "::group::run $i copy $c failed"
                grep -E "panicked|never matched|openpty|^test .* FAILED|finished in" -A2 "out-$i-$c.txt" | head -30
                echo "::endgroup::"
              fi
            done
            echo "run $i took $((SECONDS - start))s"
          done
          kill $(jobs -p) 2>/dev/null || true
          echo "failed binaries: $fails/30"
          test "$fails" -eq 0
