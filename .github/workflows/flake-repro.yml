name: flake-repro

# Temporary (backlog #17): loops the flaky daemon tests on the runners they flake on.
on:
  push:
    branches: ["fix/17-intermittent-ci-test-failures-on"]

permissions:
  contents: read

jobs:
  loop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            test: daemon
          - os: windows-latest
            test: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p valkyrie-daemon --test ${{ matrix.test }} --locked --no-run
      - name: pty limits
        if: runner.os == 'macOS'
        run: |
          sysctl kern.tty.ptmx_max || true
          ls /dev/ttys* | wc -l
          nproc || sysctl -n hw.ncpu
      - name: loop
        shell: bash
        run: |
          fails=0
          for i in $(seq 1 25); do
            if ! cargo test -p valkyrie-daemon --test ${{ matrix.test }} --locked -q > out.txt 2>&1; then
              fails=$((fails + 1))
              echo "::group::run $i failed"
              grep -E "panicked|never matched|openpty|FAILED|^---- " -A3 out.txt | head -40
              echo "::endgroup::"
            fi
          done
          echo "failures: $fails/25"
          test "$fails" -eq 0
