name: flake-repro

# Temporary (backlog #17): loops the flaky daemon tests on the runners they flake on.
on:
  push:
    branches: ["fix/17-intermittent-ci-test-failures-on"]

permissions:
  contents: read

jobs:
  loop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked --no-run
      - name: pty limits
        if: runner.os == 'macOS'
        run: |
          sysctl kern.tty.ptmx_max || true
          ls /dev/ttys* | wc -l
          nproc || sysctl -n hw.ncpu
      - name: loop
        shell: bash
        run: |
          fails=0
          for i in $(seq 1 20); do
            start=$SECONDS
            if ! cargo test --workspace --locked --no-fail-fast -q > out.txt 2>&1; then
              fails=$((fails + 1))
              echo "::group::run $i failed"
              grep -E "panicked|never matched|openpty|FAILED|^---- " -A3 out.txt | head -40
              echo "::endgroup::"
              grep -E "^test .* FAILED$|^    [a-z_:]+$" out.txt | sed "s/^/run $i: /"
            fi
            echo "run $i took $((SECONDS - start))s"
          done
          echo "failures: $fails/20"
          test "$fails" -eq 0
