# Builds `valk` and attaches it to a GitHub release, so a machine can install
# the binary without the source (docs/install.md). release-please.yml calls it when
# a release pull request is merged (docs/releasing.md); a pushed `v*` tag or a
# manual run does the same by hand. The release stays a draft until every build
# is up, so `releases/latest` never points at one without binaries.
name: release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  # The release first, so each build uploads to it directly: no Actions
  # artifacts, which count against the account's storage quota.
  release:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        # A draft gets no tag until it is published, and the builds check the tag
        # out, so a manual run with a new tag makes the tag first.
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null \
            || gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --draft

  build:
    needs: release
    strategy:
      matrix:
        include:
          # Static (musl), so one file runs on any Linux and any WSL distro,
          # whatever its glibc.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      # The tag, not the branch a manual run was started from.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      # The tag's commit, also for a manual run: `valk upgrade` compares it with
      # what the tag points at (build.rs).
      - name: stamp
        shell: bash
        run: echo "VALK_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: cargo build --locked --release -p valkyrie --target ${{ matrix.target }}
      - name: publish
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          NAME: valk-${{ matrix.target }}.tar.gz
        run: |
          tar -czf "$NAME" -C target/${{ matrix.target }}/release valk
          shasum -a 256 "$NAME" > "$NAME.sha256"
          gh release upload "$TAG" "$NAME" "$NAME.sha256" --clobber
      - name: publish Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          NAME: valk-${{ matrix.target }}.zip
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/valk.exe -DestinationPath $env:NAME
          $hash = (Get-FileHash $env:NAME -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:NAME" | Set-Content "$env:NAME.sha256" -Encoding ascii
          gh release upload $env:TAG $env:NAME "$env:NAME.sha256" --clobber

  installers:
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release upload "$TAG" install-release.sh install.ps1 install-wsl.ps1 --clobber
      # Publish once. `valk upgrade` installs whatever is latest, so a backport or a
      # re-run for an older tag must not become it.
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = true ] || exit 0
          newest=$( { gh release list --exclude-drafts --json tagName -q '.[].tagName'; echo "$TAG"; } \
            | sort -V | tail -n 1)
          latest=false
          [ "$newest" = "$TAG" ] && latest=true
          gh release edit "$TAG" --draft=false --latest="$latest"
