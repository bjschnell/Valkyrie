# Builds `valk` and attaches it to a GitHub release, so a machine can install
# the binary without the source (docs/install.md). Push a tag to cut one:
#   git tag v0.0.2 && git push origin v0.0.2
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, e.g. v0.0.2"
        required: true

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  # The release first, so each build uploads to it directly: no Actions
  # artifacts, which count against the account's storage quota.
  release:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes

  build:
    needs: release
    strategy:
      matrix:
        include:
          # Static (musl), so one file runs on any Linux and any WSL distro,
          # whatever its glibc.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --locked --release -p valkyrie --target ${{ matrix.target }}
      - name: publish
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          NAME: valk-${{ matrix.target }}.tar.gz
        run: |
          tar -czf "$NAME" -C target/${{ matrix.target }}/release valk
          shasum -a 256 "$NAME" > "$NAME.sha256"
          gh release upload "$TAG" "$NAME" "$NAME.sha256" --clobber
      - name: publish Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          NAME: valk-${{ matrix.target }}.zip
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/valk.exe -DestinationPath $env:NAME
          $hash = (Get-FileHash $env:NAME -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:NAME" | Set-Content "$env:NAME.sha256" -Encoding ascii
          gh release upload $env:TAG $env:NAME "$env:NAME.sha256" --clobber

  installers:
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" install-release.sh install.ps1 install-wsl.ps1 --clobber
