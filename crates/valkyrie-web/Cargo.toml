[package]
name = "valkyrie-web"
description = "Valkyrie web app server: serves the app and bridges it to the daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
valkyrie-proto.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
axum = { version = "0.8", features = ["ws"] }
include_dir = "0.7"
sha2 = "0.10"
getrandom = "0.3"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }
# Web Push: RFC 8291 encryption and VAPID signing.
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
hkdf = "0.12"
aes-gcm = "0.10"
# Posting to push services; TLS by rustls with ring (no C toolchain beyond cc).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tokio.workspace = true
