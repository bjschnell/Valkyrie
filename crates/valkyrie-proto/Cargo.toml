[package]
name = "valkyrie-proto"
description = "Valkyrie wire protocol: message types, frame codec, async client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
# web/src/proto.gen.ts is generated from these types by a test (src/ts.rs).
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
