[package]
name = "valkyrie-desktop"
description = "Valkyrie desktop app: the shell around the web app (ADR-0020)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The app itself: a Tauri window around the core. Off by default, so the
# workspace builds without a system webview (WebKitGTK on Linux) and on the
# workspace's minimum Rust, which is older than Tauri's.
window = [
    "dep:serde_json",
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-autostart",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-single-instance",
    "dep:tracing-subscriber",
]

[[bin]]
name = "valk-desktop"
path = "src/bin/valk-desktop.rs"
required-features = ["window"]

[[example]]
name = "probe"
required-features = ["window"]

[dependencies]
valkyrie-proto.workspace = true
valkyrie-web.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
tauri = { version = "2.12", optional = true, features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
serde_json = { workspace = true, optional = true }

[build-dependencies]
tauri-build = { version = "2.7", optional = true }

[dev-dependencies]
# Paused time, for the wait on a service that never answers.
tokio = { workspace = true, features = ["test-util"] }
