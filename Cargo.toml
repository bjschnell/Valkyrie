[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
overseer-proto = { path = "crates/overseer-proto" }
overseer-term = { path = "crates/overseer-term" }
overseer-daemon = { path = "crates/overseer-daemon" }
overseer-tui = { path = "crates/overseer-tui" }
overseer-agents = { path = "crates/overseer-agents" }
alacritty_terminal = "0.26"
portable-pty = "0.9"
ratatui = "0.30"
tokio = { version = "1.47", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
