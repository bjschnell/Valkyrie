[workspace]
resolver = "3"
members = [
    "crates/valkyrie",
    "crates/valkyrie-agents",
    "crates/valkyrie-context",
    "crates/valkyrie-daemon",
    "crates/valkyrie-proto",
    "crates/valkyrie-term",
    "crates/valkyrie-tui",
    "crates/valkyrie-web",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.88"

[workspace.dependencies]
valkyrie-proto = { path = "crates/valkyrie-proto" }
valkyrie-term = { path = "crates/valkyrie-term" }
valkyrie-daemon = { path = "crates/valkyrie-daemon" }
valkyrie-tui = { path = "crates/valkyrie-tui" }
valkyrie-agents = { path = "crates/valkyrie-agents" }
valkyrie-web = { path = "crates/valkyrie-web" }
valkyrie-context = { path = "crates/valkyrie-context" }
alacritty_terminal = "0.26"
portable-pty = "0.9"
ratatui = "0.30"
tokio = { version = "1.47", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libc = "0.2"
windows-sys = { version = "0.61", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
